# dsh-plugin-ai-daily-push 的 bundle patch 层。
#
# `dsh plugin --profile <profile> add <本包>` 会读本文件，把这条 loader entry 插进 profile 树。
# 插件市场只收声明了 `dsh.bundle` 且带本文件的包。
#
# 两条硬规则：
#   · `name` 必须与 package.json 的 `name` **完全一致**，写成别的会在开机解析时失败；
#   · `id` 是 Cordis 插件 id（= lib/index.js 的 `export const name`）。
#
# 本插件没有需要在这里覆写的配置：它只把包自带的 SKILL.md 挂进技能目录，
# 没有阈值、没有端点、没有密钥。推送密钥由用户放进 SKILL.md 里说明的
# ~/.dsh/ai-daily-push/config.env，运行时由 scripts/push.py 读取——不进这里。
- insert:
    - id: ai-daily-push
      name: 'dsh-plugin-ai-daily-push'
